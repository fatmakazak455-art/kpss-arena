<head>

<title>KPSS Arena</title>

<style>
:root{--bg:#e3f2fb;--card:#f8fcff;--tx:#12324a;--mu:#4f7189;--ac:#1e88c7;--ok:#1f9d55;--no:#d64545;--bd:#b7d9ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2635;--card:#153548;--tx:#e6f4fc;--mu:#8fb6cc;--ac:#5cc0f0;--ok:#3ec27a;--no:#ef6b6b;--bd:#2a5570}}
:root[data-theme="dark"]{--bg:#0e2635;--card:#153548;--tx:#e6f4fc;--mu:#8fb6cc;--ac:#5cc0f0;--ok:#3ec27a;--no:#ef6b6b;--bd:#2a5570}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:12px}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.top span{padding:4px 10px;border-radius:20px;border:1px solid transparent}
.top .on{border-color:var(--ac);color:var(--ac)}
.tag{display:inline-block;font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;margin:0 6px 10px 0}
h1{font-size:22px;margin:8px 0}
.bk{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;min-height:40px;font-weight:600}
.st{display:flex;gap:8px;margin-top:12px}
.st div{flex:1;text-align:center;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 4px;font-size:14px}
.st b{display:block;font-size:22px;color:var(--ac)}
.pg{display:flex;gap:6px;overflow-x:auto;padding:10px 2px;position:relative;-webkit-overflow-scrolling:touch}
.pc{flex:0 0 38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:0;font-weight:600}
.pc.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.pc.no{background:var(--no);border-color:var(--no);color:#fff}
.pc.cur{outline:2px solid var(--ac);outline-offset:1px}
.pc:disabled{opacity:.4}
button,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.opt{min-height:50px;font-size:17px}
body{-webkit-text-size-adjust:100%}
@media(max-width:480px){main{padding:10px}.card{padding:14px}h1{font-size:20px}.top{font-size:14px}}
select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-top:6px}
button{font:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:8px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.main{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;margin-top:12px;width:100%;font-weight:600}
.exp{margin-top:12px;color:var(--mu);font-size:15px}
table{width:100%;border-collapse:collapse;margin-top:8px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--bd);font-size:15px}
</style>
</head>

["Coğrafya",2,"GAP kapsamında hangi akarsular üzerinde barajlar yapılmıştır?","Fırat ve Dicle","Kızılırmak ve Sakarya","Gediz ve Menderes","Seyhan ve Ceyhan"],
["Coğrafya",2,"Harran Ovası'nda GAP ile sulamanın artmasıyla hangi ürünün üretimi artmıştır?","Pamuk","Çay","Fındık","Muz"],
["Coğrafya",3,"Aşağıdakilerden hangileri tektonik kökenli göllerdendir?¶I. Nemrut Gölü¶II. Hazar Gölü¶III. Eğirdir Gölü","II ve III","Yalnız II","I ve II","I ve III","Nemrut Gölü krater gölüdür."],
["Coğrafya",3,"Aşağıdaki göllerden hangisi volkanik set gölüdür?","Van Gölü","Eğirdir Gölü","Beyşehir Gölü","Tuz Gölü","Nemrut Dağı'nın lavları suyun önünü kapattı."],
["Coğrafya",3,"Türkiye'nin yüzölçümü bakımından en büyük baraj gölü hangisidir?","Atatürk Barajı Gölü","Keban Barajı Gölü","Karakaya Barajı Gölü","Hirfanlı Barajı Gölü"],
["Coğrafya",2,"Muz yetiştiriciliği Türkiye'de en çok hangi kıyılarda yapılır?","Akdeniz kıyıları","Karadeniz kıyıları","Ege kıyıları","Marmara kıyıları","Anamur ve Alanya çevresi öne çıkar."],
["Coğrafya",1,"Kayısı yetiştiriciliği ile ünlü olan il hangisidir?","Malatya","Aydın","Rize","Edirne"],
["Coğrafya",2,"Marmara Bölgesi'nde sanayinin yoğunlaşmasında hangi etkenler rol oynamıştır?¶I. Geniş pazar¶II. Ulaşım kolaylığı¶III. Limanların varlığı","I, II ve III","I ve II","I ve III","II ve III","Üçü de etkilidir."],
["Coğrafya",3,"Çukurova'da tarımın gelişmesine hangileri katkı sağlamıştır?¶I. Akarsularla taşınan alüvyon¶II. Akdeniz iklimi¶III. Sulama olanakları","I, II ve III","I ve II","I ve III","II ve III","Üçü de etkilidir."],
["Coğrafya",2,"Şeker pancarı Türkiye'de en çok hangi bölgede üretilir?","İç Anadolu","Akdeniz","Doğu Anadolu","Güneydoğu Anadolu"],
["Coğrafya",1,"Türkiye'de tuz üretimi en çok hangi gölden yapılır?","Tuz Gölü","Van Gölü","Burdur Gölü","Beyşehir Gölü"],
["Coğrafya",3,"Aşağıdakilerden hangileri akarsuların biriktirmesiyle oluşan (alüvyal) ovalardandır?¶I. Çukurova¶II. Bafra¶III. Konya","I ve II","Yalnız I","I ve III","II ve III","Konya Ovası eski göl tabanıdır."],
].map((a,i)=>({id:i,ders:a[0],z:a[1],soru:a[2],opt:a.slice(3,7),acik:a[7],m:a[8]}));

const TUR=40, SEV=["Kolay","Orta","Zor"];
// Ders ağırlıkları (Tarih en ağır) ve her derse özel renk
const AGIRLIK={"Tarih":40,"Coğrafya":25,"Vatandaşlık":15,"Türkçe":10,"Matematik":10};
const DC={"Türkçe":"#e0526a","Matematik":"#1e88c7","Tarih":"#c9791a","Coğrafya":"#1f9d55","Vatandaşlık":"#8b5cf6"};
const DERS=[...new Set(Q.map(q=>q.ders))];
const $=document.getElementById("app");
let G;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const TR=[[28.0,41.98],[27.3,42.0],[26.6,41.85],[26.33,41.71],[26.6,41.35],[26.38,40.92],[26.05,40.77],[26.6,40.5],[26.18,40.05],[26.05,39.5],[26.7,39.3],[26.9,38.9],[26.8,38.4],[26.3,38.3],[27.25,37.85],[27.4,37.0],[27.2,36.7],[28.3,36.85],[29.1,36.6],[29.6,36.2],[30.15,36.3],[30.7,36.85],[32.0,36.5],[32.8,36.05],[34.6,36.8],[35.35,36.55],[36.17,36.58],[36.0,35.85],[36.55,36.25],[37.1,36.7],[38.0,36.85],[38.95,36.7],[40.0,36.83],[41.2,37.1],[42.35,37.3],[42.85,37.2],[43.6,37.25],[44.2,37.55],[44.8,37.15],[44.3,38.3],[44.2,39.35],[44.5,39.7],[44.8,39.7],[44.0,40.05],[43.5,40.55],[43.45,41.1],[42.7,41.55],[41.55,41.52],[40.5,41.0],[39.7,41.0],[38.4,40.9],[37.9,41.0],[36.3,41.3],[35.2,42.0],[33.7,41.98],[32.3,41.7],[31.8,41.45],[31.15,41.1],[30.2,41.15],[29.6,41.2],[29.1,41.25],[28.5,41.55],[28.1,41.6]];
const px=(lo,la)=>[Math.round((lo-25.5)*36.9),Math.round((42.3-la)*47.5)];
function harita(m){
  const pts=TR.map(t=>px(t[0],t[1]).join(",")).join(" "),[x,y]=px(m[0],m[1]),[mx,my]=px(28.2,40.7);
  return `<svg viewBox="0 0 720 320" style="width:100%;margin-top:10px"><polygon points="${pts}" fill="var(--bg)" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round"/><ellipse cx="${mx}" cy="${my}" rx="55" ry="13" fill="var(--ac)" opacity=".35"/><circle cx="${x}" cy="${y}" r="9" fill="var(--no)" stroke="#fff" stroke-width="2"/></svg>`;
}
function kapak(){
  const ic=[["🏛️","Tarih"],["🗺️","Coğrafya"],["⚖️","Vatandaşlık"],["📖","Türkçe"],["➗","Matematik"]];
  const pts=TR.map(t=>px(t[0],t[1]).join(",")).join(" ");
  const f="font-family:system-ui,-apple-system,sans-serif";
  return `<svg viewBox="0 0 720 300" style="width:100%;border-radius:14px;display:block"><defs><linearGradient id="kg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf7ff"/><stop offset="1" stop-color="#7cc4ee"/></linearGradient></defs><rect width="720" height="300" fill="url(#kg)"/><polygon points="${pts}" transform="translate(0,-4)" fill="#1e88c7" opacity=".3"/><text x="360" y="118" text-anchor="middle" style="${f};font-size:72px;font-weight:800;letter-spacing:2px" fill="#0b3550">KPSS ARENA</text><text x="360" y="158" text-anchor="middle" style="${f};font-size:21px" fill="#0b3550">Bilgi düellosu: karışık sorular, öncüllüler, iki kişilik yarış</text>${ic.map((x,i)=>`<circle cx="${120+i*120}" cy="232" r="36" fill="${DC[x[1]]}" stroke="#fff" stroke-width="4"/><text x="${120+i*120}" y="245" text-anchor="middle" style="font-size:36px">${x[0]}</text>`).join("")}</svg>`;
}
let SEC="Karışık";
function menu(){
  SCR="menu";
  const ops=["Karışık",...DERS].map(d=>`<option ${d===SEC?"selected":""}>${d}</option>`).join("");
  $.innerHTML=`<button class="bk" id="bk">← Giriş</button><div class="card"><h1>Oyunu Kur</h1>
  <p>Ders seç ya da karışık oyna. Karışıkta en sık Tarih, sonra Coğrafya gelir. Oyun 40 turdur; geçmiş turlara dönüp sorulara tekrar bakabilirsin. Sorular kolaydan zora gider; doğru cevap 10, 20 veya 30 puan kazandırır ve soru otomatik geçilir; yanlışta açıklamayı görürsün.</p>
  <select id="ds">${ops}</select>
  <button class="main" id="a">Tek kişi</button>
  <button class="main" id="b">İki kişi (yarışma)</button>
  <p class="exp">İki kişide oyuncular aynı cihazda sırayla oynar; her turda ikisi de aynı zorlukta soru alır.</p></div>`;
  document.getElementById("bk").onclick=()=>history.back();ds.onchange=()=>SEC=ds.value;a.onclick=()=>start(1);b.onclick=()=>start(2);
}

function start(n){
  history.pushState({s:"oyun"},"");SCR="oyun";
  const hv=Q.filter(q=>SEC==="Karışık"||q.ders===SEC);
  G={n,t:0,used:new Set(),hist:[],v:null,fin:false,havuz:hv,tur:Math.min(TUR,hv.length),p:Array.from({length:n},(_,i)=>({ad:n>1?"Oyuncu "+(i+1):"Sen",puan:0,stat:Object.fromEntries(DERS.map(d=>[d,{d:0,y:0}]))}))};
  next();
}

// Karışık soru: seviyeye en yakın kalan sorular içinden, oyuncunun yanlış yaptığı derse ağırlık vererek seç
function pick(pi,L){
  let free=G.havuz.filter(q=>!G.used.has(q.id));
  if(!free.length)return null;
  const m=Math.min(...free.map(q=>Math.abs(q.z-L)));
  free=free.filter(q=>Math.abs(q.z-L)===m);
  const ds=[...new Set(free.map(q=>q.ders))],w=ds.map(d=>AGIRLIK[d]*(1+0.3*G.p[pi].stat[d].y));
  let r=Math.random()*w.reduce((a,b)=>a+b,0),ders=ds[0];
  for(let i=0;i<ds.length;i++){r-=w[i];if(r<=0){ders=ds[i];break}}
  const c=free.filter(q=>q.ders===ders);
  return c[Math.floor(Math.random()*c.length)];
}

const ORD=["Yalnız I","Yalnız II","Yalnız III","I ve II","I ve III","II ve III","I, II ve III"];
function next(){
  if(SCR!=="oyun")return;
  G.v=null;
  if(G.t>=G.tur)return end();
  G.pi=G.t%G.n;G.L=1+Math.floor(G.t*3/G.tur);
  const q=pick(G.pi,G.L);if(!q)return end();
  G.used.add(q.id);G.ci=G.t;
  const o=q.opt.map((t,i)=>({t,ok:i===0}));
  G.hist[G.t]={q,pi:G.pi,L:G.L,sec:null,ok:null,sirali:o.every(x=>ORD.includes(x.t))?o.sort((a,b)=>ORD.indexOf(a.t)-ORD.indexOf(b.t)):shuffle(o)};
  draw();
}

function draw(){
  const vi=G.v==null?G.ci:G.v,E=G.hist[vi],q=E.q,ans=E.sec!==null,ro=vi!==G.ci,cp=G.hist[G.ci].pi;
  let h=`<div class="top"><button class="bk" id="bk">←</button>${G.p.map((p,i)=>`<span class="${i===cp?"on":""}">${p.ad}: ${p.puan}</span>`).join("")}</div><div class="pg">`;
  for(let i=0;i<G.tur;i++){const e=G.hist[i];h+=`<button class="pc${e&&e.sec!==null?(e.ok?" ok":" no"):""}${i===vi?" cur":""}" data-i="${i}" ${i>G.ci?"disabled":""}>${i+1}</button>`}
  h+=`</div><div class="card" style="border-left:5px solid ${DC[q.ders]}"><span class="tag">Tur ${vi+1}/${G.tur}</span><span class="tag">${SEV[E.L-1]}</span><span class="tag" style="color:${DC[q.ders]};border-color:${DC[q.ders]}">${q.ders}</span>${G.n>1?`<span class="tag">${G.p[E.pi].ad}</span>`:""}<div><b>${q.soru.replace(/¶/g,"<br>")}</b></div>${q.m?harita(q.m):""}`;
  E.sirali.forEach((o,k)=>{
    let c="opt";
    if(ans){if(o.ok)c+=" ok";else if(k===E.sec)c+=" no"}
    h+=`<button class="${c}" data-k="${k}" ${ans||ro?"disabled":""}>${o.t}</button>`;
  });
  if(ans&&(ro||!E.ok||G.fin))h+=`<div class="exp">${q.acik||"Doğru cevap yeşil işaretli."}</div>`;
  if(G.fin)h+=`<button class="main" id="n">Sonuçlara dön</button>`;
  else if(ro)h+=`<button class="main" id="n">Şu anki tura dön</button>`;
  else if(ans&&!E.ok)h+=`<button class="main" id="n">${G.t>=G.tur?"Sonuçları gör":(G.n>1?"Sıra: "+G.p[G.t%G.n].ad:"Sonraki tur")}</button>`;
  $.innerHTML=h+"</div>";
  document.getElementById("bk").onclick=()=>history.back();
  $.querySelectorAll(".opt").forEach(b=>b.onclick=()=>cevap(+b.dataset.k));
  $.querySelectorAll(".pc").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;G.v=i===G.ci?null:i;draw()});
  const n=document.getElementById("n");if(n)n.onclick=G.fin?end:ro?()=>{G.v=null;draw()}:next;
  const pg=$.querySelector(".pg"),c=$.querySelector(".pc.cur");if(c)pg.scrollLeft=c.offsetLeft-pg.clientWidth/2;
}

function cevap(k){
  const E=G.hist[G.ci];
  if(E.sec!==null||(G.v!=null&&G.v!==G.ci))return;
  const p=G.p[E.pi],ok=E.sirali[k].ok;
  E.sec=k;E.ok=ok;G.t++;
  if(ok){p.puan+=10*E.L;p.stat[E.q.ders].d++}else p.stat[E.q.ders].y++;
  draw();if(ok)setTimeout(next,700);
}

function end(){
  SCR="sonuc";G.fin=false;
  const mx=Math.max(...G.p.map(p=>p.puan)),w=G.p.filter(p=>p.puan===mx);
  const baslik=G.n===1?"Oyun bitti":(w.length>1?"🤝 Berabere!":"🏆 "+w[0].ad+" kazandı!");
  const rows=DERS.map(d=>`<tr><td>${d}</td>${G.p.map(p=>`<td>${p.stat[d].d} ✓ ${p.stat[d].y} ✗</td>`).join("")}</tr>`).join("");
  $.innerHTML=`<div class="card"><h1>${baslik}</h1>
  ${G.p.map(p=>`<div>${p.ad}: <b>${p.puan}</b> puan</div>`).join("")}
  <table><tr><th>Ders</th>${G.p.map(p=>`<th>${p.ad}</th>`).join("")}</tr>${rows}</table>
  <button class="main" id="v">Soruları incele</button>
  <button class="main" id="r">Ana menü</button></div>`;
  v.onclick=()=>{G.fin=true;G.v=null;G.ci=G.hist.length-1;draw()};
  r.onclick=()=>history.back();
}

let SCR="giris";
function giris(){
  SCR="giris";
  $.innerHTML=`${kapak()}<div class="card"><p style="margin-top:0">KPSS'ye hazırlananlar için ÖSYM tarzı, karışık ve yarışmalı bilgi oyunu.</p>
  <div class="st"><div><b>${Q.length}</b>soru</div><div><b>${TUR}</b>tur</div><div><b>1-2</b>oyuncu</div></div>
  <button class="main" id="go">Başla</button></div>`;
  document.getElementById("go").onclick=()=>{history.pushState({s:"menu"},"");menu()};
}
// Telefonun/tarayıcının geri tuşu: oyun → menü → giriş
addEventListener("popstate",()=>{
  if(SCR==="oyun"&&G&&G.t>0){
    if(confirm("Oyundan çıkılsın mı? Mevcut puanların silinir."))menu();
    else history.pushState({s:"oyun"},"");
  }else if(SCR==="giris")return;
  else if(SCR==="menu")giris();
  else menu();
});
history.replaceState({s:"giris"},"");
giris();
</script>
